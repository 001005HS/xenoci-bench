name: autocancel-1121
# runner-autocancel-prod lane (2026-11-21): production check of XenoCI auto-cancel of superseded PR runs.
on:
  pull_request:
    paths: ['autocancel-1121/**']
  push:
    branches: [main]
    paths: ['autocancel-1121/**']
jobs:
  slow:
    runs-on: xenoci-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - run: |
          echo "sha=${{ github.sha }} event=${{ github.event_name }}"
          sleep 150
