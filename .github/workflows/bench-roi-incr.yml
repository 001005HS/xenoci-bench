name: bench-roi-incr
# PR-like incremental build: IceCubesApp b2db303 + one Swift file changed. A priming job builds once and saves
# DerivedData + SwiftPM caches with actions/cache; each of 5 trials restores them (restore time counted), checks
# out the same commit at the same path, changes one line and builds. Same incr.sh as the XenoCI runs.
on:
  workflow_dispatch:
    inputs:
      runner: { description: runs-on label, required: true, default: xenoci-macos }
      xcode: { description: Xcode version, required: true, default: '26.6' }
jobs:
  prime:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: incr script
        run: |
          cat > "$RUNNER_TEMP/incr.sh" <<'INCR_EOF'
          #!/bin/bash
          # bench-roi incremental (PR-like): IceCubesApp b2db303 + one Swift file changed per build, default DerivedData.
          # LAYOUT=perbuild: checkout inside the build's own work dir (what the rental driver does today: ~/work/<build>/src).
          # LAYOUT=stable:   one persistent checkout per repository, updated in place (proposed driver change).
          set -euo pipefail
          LAYOUT=${LAYOUT:-perbuild}; XC_VER=${XC_VER:-26.6}; N=${N:-0}
          t(){ perl -MTime::HiRes=time -e 'printf "%.3f", time'; }
          d(){ perl -e "printf '%.1f', $2-$1"; }
          echo "TIMING script_start $(t) layout=$LAYOUT n=$N pwd=$PWD"
          export DEVELOPER_DIR=/Applications/Xcode_${XC_VER}.app/Contents/Developer
          if [ "$LAYOUT" = stable ]; then W="$HOME/stable-src"; else W="$PWD/src"; fi
          a=$(t)
          if [ ! -d "$W/.git" ]; then rm -rf "$W"; mkdir -p "$W"; git -C "$W" init -q; git -C "$W" remote add origin https://github.com/Dimillian/IceCubesApp.git; fi
          git -C "$W" fetch -q --depth 1 origin b2db3033fbf67a97b54d25d6dac2df8a029b26b1
          git -C "$W" checkout -q --force --detach FETCH_HEAD
          b=$(t); echo "TIMING fetch_src $(d $a $b)"
          cd "$W"; printf 'DEVELOPMENT_TEAM =\nBUNDLE_ID_PREFIX = im.cicd.bench\n' > IceCubesApp.xcconfig
          # the PR change: one line in one Swift file (different every build)
          F=$(git ls-files 'IceCubesApp/App/Main/*.swift' | head -1); [ -n "$F" ] || F=$(git ls-files '*.swift' | grep -v Packages | head -1)
          printf '\n// bench-roi change %s %s\n' "$N" "$(date +%s)" >> "$F"; echo "CHANGED $F"
          X="CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO COMPILER_INDEX_STORE_ENABLE=NO"
          a=$(t); xcodebuild -resolvePackageDependencies -scheme IceCubesApp -project IceCubesApp.xcodeproj -scmProvider system -skipMacroValidation -skipPackagePluginValidation $X > /tmp/resolve.log 2>&1 || { tail -20 /tmp/resolve.log; exit 3; }
          b=$(t); echo "TIMING spm_resolve $(d $a $b)"
          a=$(t); set +e; xcodebuild build -scheme IceCubesApp -project IceCubesApp.xcodeproj -destination 'generic/platform=iOS Simulator' -configuration Debug -scmProvider system -skipMacroValidation -skipPackagePluginValidation $X > /tmp/build.log 2>&1; rc=$?; set -e; b=$(t)
          echo "TIMING app_build $(d $a $b) rc=$rc compiled=$(grep -c '^SwiftCompile\|^CompileSwift' /tmp/build.log || true)"; tail -2 /tmp/build.log
          echo "STATE work=$(ls ~/work | tr '\n' ' ') dd=$(ls ~/Library/Developer/Xcode/DerivedData 2>/dev/null | tr '\n' ' ') disk=$(df -h ~ | tail -1 | awk '{print $4}')"
          echo "TOOLS rsync=$(command -v rsync || echo none)"
          echo "TIMING script_end $(t)"
          test $rc -eq 0

          INCR_EOF
      - name: prime build
        env: { LAYOUT: stable, N: "0", XC_VER: "${{ inputs.xcode }}" }
        run: bash "$RUNNER_TEMP/incr.sh"
      - uses: actions/cache/save@v4
        with: { path: "~/Library/Developer/Xcode/DerivedData\n~/Library/Caches/org.swift.swiftpm\n~/Library/org.swift.swiftpm", key: "incr-${{ inputs.xcode }}-${{ github.run_id }}" }
  trial:
    needs: [prime]
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: { trial: [1, 2, 3, 4, 5] }
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: cache restore
        uses: actions/cache/restore@v4
        with: { path: "~/Library/Developer/Xcode/DerivedData\n~/Library/Caches/org.swift.swiftpm\n~/Library/org.swift.swiftpm", key: "incr-${{ inputs.xcode }}-${{ github.run_id }}", fail-on-cache-miss: true }
      - name: incr script
        run: |
          cat > "$RUNNER_TEMP/incr.sh" <<'INCR_EOF'
          #!/bin/bash
          # bench-roi incremental (PR-like): IceCubesApp b2db303 + one Swift file changed per build, default DerivedData.
          # LAYOUT=perbuild: checkout inside the build's own work dir (what the rental driver does today: ~/work/<build>/src).
          # LAYOUT=stable:   one persistent checkout per repository, updated in place (proposed driver change).
          set -euo pipefail
          LAYOUT=${LAYOUT:-perbuild}; XC_VER=${XC_VER:-26.6}; N=${N:-0}
          t(){ perl -MTime::HiRes=time -e 'printf "%.3f", time'; }
          d(){ perl -e "printf '%.1f', $2-$1"; }
          echo "TIMING script_start $(t) layout=$LAYOUT n=$N pwd=$PWD"
          export DEVELOPER_DIR=/Applications/Xcode_${XC_VER}.app/Contents/Developer
          if [ "$LAYOUT" = stable ]; then W="$HOME/stable-src"; else W="$PWD/src"; fi
          a=$(t)
          if [ ! -d "$W/.git" ]; then rm -rf "$W"; mkdir -p "$W"; git -C "$W" init -q; git -C "$W" remote add origin https://github.com/Dimillian/IceCubesApp.git; fi
          git -C "$W" fetch -q --depth 1 origin b2db3033fbf67a97b54d25d6dac2df8a029b26b1
          git -C "$W" checkout -q --force --detach FETCH_HEAD
          b=$(t); echo "TIMING fetch_src $(d $a $b)"
          cd "$W"; printf 'DEVELOPMENT_TEAM =\nBUNDLE_ID_PREFIX = im.cicd.bench\n' > IceCubesApp.xcconfig
          # the PR change: one line in one Swift file (different every build)
          F=$(git ls-files 'IceCubesApp/App/Main/*.swift' | head -1); [ -n "$F" ] || F=$(git ls-files '*.swift' | grep -v Packages | head -1)
          printf '\n// bench-roi change %s %s\n' "$N" "$(date +%s)" >> "$F"; echo "CHANGED $F"
          X="CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO COMPILER_INDEX_STORE_ENABLE=NO"
          a=$(t); xcodebuild -resolvePackageDependencies -scheme IceCubesApp -project IceCubesApp.xcodeproj -scmProvider system -skipMacroValidation -skipPackagePluginValidation $X > /tmp/resolve.log 2>&1 || { tail -20 /tmp/resolve.log; exit 3; }
          b=$(t); echo "TIMING spm_resolve $(d $a $b)"
          a=$(t); set +e; xcodebuild build -scheme IceCubesApp -project IceCubesApp.xcodeproj -destination 'generic/platform=iOS Simulator' -configuration Debug -scmProvider system -skipMacroValidation -skipPackagePluginValidation $X > /tmp/build.log 2>&1; rc=$?; set -e; b=$(t)
          echo "TIMING app_build $(d $a $b) rc=$rc compiled=$(grep -c '^SwiftCompile\|^CompileSwift' /tmp/build.log || true)"; tail -2 /tmp/build.log
          echo "STATE work=$(ls ~/work | tr '\n' ' ') dd=$(ls ~/Library/Developer/Xcode/DerivedData 2>/dev/null | tr '\n' ' ') disk=$(df -h ~ | tail -1 | awk '{print $4}')"
          echo "TOOLS rsync=$(command -v rsync || echo none)"
          echo "TIMING script_end $(t)"
          test $rc -eq 0

          INCR_EOF
      - name: incremental build
        env: { LAYOUT: stable, N: "${{ matrix.trial }}", XC_VER: "${{ inputs.xcode }}" }
        run: bash "$RUNNER_TEMP/incr.sh"
