name: linux-lab compare
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label
        required: true
        default: xenoci-2vcpu-ubuntu-2404
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install
        run: |
          mkdir -p app && cd app && npm init -y >/dev/null
          time npm install --no-audit --no-fund lodash express typescript
      - name: docker build and run
        run: |
          printf 'FROM alpine:3.20\nRUN apk add --no-cache curl\nCMD ["sh","-c","echo docker-ok"]\n' > Dockerfile
          time docker build -t lab-probe .
          docker run --rm lab-probe
      - name: cpu
        run: |
          nproc; free -g; df -h /
          time sh -c 'for i in $(seq 1 4); do (seq 1 3000000 | sha256sum >/dev/null) & done; wait'
