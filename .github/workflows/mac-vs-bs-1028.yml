name: mac-vs-bs-1028
run-name: mvb-${{ inputs.runner }}-${{ inputs.mode }}-${{ inputs.probe }}
# mac-2x (2026-10-28): the same iOS workload on any macOS runner label.
# IceCubesApp 98098b9c: SwiftPM resolve, app build for iOS Simulator, ModelsTests on a booted iPhone simulator.
# mode=cold: no cache restore (cache is still saved so later warm runs can restore).
# mode=warm: actions/cache restore of SwiftPM checkouts + DerivedData for this runner label, then save.
# Manual dispatch only. Measurement data comes from the GitHub jobs API (queued/started/completed + steps).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: blacksmith-6vcpu-macos-26 | xenoci-macos | macos-26
        required: true
      mode:
        description: cold or warm
        required: true
        default: cold
      probe:
        required: true
permissions:
  contents: read
concurrency:
  group: mvb-${{ inputs.runner }}
  cancel-in-progress: false
env:
  W: ${{ github.workspace }}/../mvb
jobs:
  ios:
    name: ios
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - name: host info
        shell: bash
        run: |
          sysctl -n hw.model hw.ncpu hw.memsize machdep.cpu.brand_string || true
          sw_vers -productVersion; df -h / | tail -1
          ls -d /Applications/Xcode*.app
      - name: select xcode
        shell: bash
        run: |
          XC=$(ls -d /Applications/Xcode_26.6*.app /Applications/Xcode-26.6*.app /Applications/Xcode_26*.app /Applications/Xcode-26*.app /Applications/Xcode.app 2>/dev/null | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -version
      - name: checkout IceCubesApp
        uses: actions/checkout@v4
        with:
          repository: Dimillian/IceCubesApp
          ref: 98098b9c4b5928f89f338203193c2bf40ab7f38c
          path: app
          persist-credentials: false
      - name: cache restore (spm+derived)
        if: ${{ inputs.mode == 'warm' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.W }}/spm
            ${{ env.W }}/dd
          key: mvb-${{ inputs.runner }}-${{ github.run_id }}
          restore-keys: mvb-${{ inputs.runner }}-
      - name: spm resolve
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          printf 'DEVELOPMENT_TEAM =\nBUNDLE_ID_PREFIX = com.xenoci.bench\n' > IceCubesApp.xcconfig
          xcodebuild -resolvePackageDependencies -project IceCubesApp.xcodeproj -scheme IceCubesApp \
            -clonedSourcePackagesDirPath "$W/spm" -derivedDataPath "$W/dd" -scmProvider system > "$W.resolve.log" 2>&1 || { tail -40 "$W.resolve.log"; exit 1; }
          tail -3 "$W.resolve.log"
      - name: xcodebuild app (simulator)
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild build -project IceCubesApp.xcodeproj -scheme IceCubesApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -clonedSourcePackagesDirPath "$W/spm" -derivedDataPath "$W/dd" \
            -disableAutomaticPackageResolution -scmProvider system \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO > "$W.build.log" 2>&1 || { tail -60 "$W.build.log"; exit 1; }
          tail -3 "$W.build.log"
      - name: simulator boot
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda p:[int(n) for n in p[0].split("iOS-")[-1].split("-")])
          print(c[-1][1]["udid"])')
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM=$UDID" >> "$GITHUB_ENV"
      - name: xcodebuild test (ModelsTests)
        shell: bash
        working-directory: app/Packages/Models
        run: |
          set -euo pipefail
          xcodebuild test -scheme ModelsTests -destination "id=$SIM" \
            -clonedSourcePackagesDirPath "$W/spm" -derivedDataPath "$W/dd" -scmProvider system \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO > "$W.test.log" 2>&1 || { tail -60 "$W.test.log"; exit 1; }
          grep -E 'Executed|Test run with|TEST SUCCEEDED' "$W.test.log" | tail -4
      - name: cache save (spm+derived)
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.W }}/spm
            ${{ env.W }}/dd
          key: mvb-${{ inputs.runner }}-${{ github.run_id }}
