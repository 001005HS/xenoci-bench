name: Counter
options:
  bundleIdPrefix: dev.example.macboxtrial
  deploymentTarget:
    iOS: "17.0"
targets:
  Counter:
    type: application
    platform: iOS
    sources: [Counter]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.macboxtrial.Counter
        SWIFT_VERSION: "5.0"
  CounterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CounterTests]
    dependencies:
      - target: Counter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CounterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CounterUITests]
    dependencies:
      - target: Counter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Counter
schemes:
  Counter:
    build:
      targets:
        Counter: all
    test:
      targets: [CounterTests, CounterUITests]
